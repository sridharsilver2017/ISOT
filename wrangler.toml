name = "isot-2026"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"

# Cloudflare D1 Database Binding
# In Cloudflare Dashboard: Pages > Settings > Functions > D1 database bindings > Variable name: DB
[[d1_databases]]
binding = "DB"
database_name = "isot-2026-db"
database_id = "your-d1-database-id-from-cloudflare"

# Cloudflare KV Binding (Optional alternative)
# [[kv_namespaces]]
# binding = "ISOT_KV"
# id = "your-kv-namespace-id"
